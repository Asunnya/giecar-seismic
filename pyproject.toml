[project]
name = "giecar-seismic"
version = "0.1.0"
description = "PyQt5 desktop app that applies streaming Butterworth filters to SEG-Y seismic surveys"
readme = "README.md"
authors = [
    { name = "Asunnya", email = "develop-asunnya@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyqt5>=5.15.11",
    "pyqtgraph>=0.14.0",
    "scipy>=1.18.1",
    "segyio>=1.9.14",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
giecar-seismic = "giecar_seismic.__main__:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[[tool.mypy.overrides]]
module = "segyio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "h5py.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PyQt5.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyqtgraph.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "scipy-stubs>=1.18.1.0",
]
