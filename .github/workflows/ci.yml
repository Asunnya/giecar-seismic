name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The CI only reads the repository: no write access to contents, PRs,
# packages or OIDC tokens, so it is safe to run on pull requests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Headless GUI stack on hosted runners: offscreen Qt platform plugin
      # (tests/conftest.py also sets it) and a non-interactive Matplotlib backend.
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libfontconfig1 libfreetype6

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check (source and tests)
        run: uv run ruff format --check src tests

      - name: Type-check
        run: uv run mypy src

      - name: Tests
        # One line on purpose: this step also runs under PowerShell on Windows.
        run: uv run pytest -q --cov=giecar_seismic --cov-report=term-missing --cov-report=xml

      # Pure-Python package (uv_build backend): one build is enough.
      - name: Build package
        if: runner.os == 'Linux'
        run: uv build

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
