name: Release

# Manual version promotion: the developer sets [project].version, commits,
# waits for CI, then pushes an annotated vMAJOR.MINOR.PATCH tag. Everything
# after the tag push happens here. Nothing is published to PyPI.
on:
  push:
    tags:
      - "v*.*.*" # broad glob; the strict format is enforced in `validate`

# Read-only everywhere; only `publish` (which runs no repository code) is
# granted contents: write to create the GitHub Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false # never interrupt a publication halfway through

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must be exactly vMAJOR.MINOR.PATCH
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not a stable release tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "tag $TAG has a valid release format"

      - name: Tag version must equal pyproject.toml version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ["TAG"]
          tag_version = tag[1:]  # strip only the leading "v"
          with open("pyproject.toml", "rb") as f:
              project_version = tomllib.load(f)["project"]["version"]
          if tag_version != project_version:
              print(
                  f"::error::tag version {tag_version!r} (from {tag}) does not match "
                  f"pyproject.toml [project].version {project_version!r}"
              )
              sys.exit(1)
          print(f"tag {tag} matches pyproject.toml version {project_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={project_version}\n")
          EOF

      - name: Tagged commit must be contained in master
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          commit="$(git rev-parse HEAD)"  # the commit the tag points to (checkout resolved it)
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/master; then
            echo "::error::commit $commit (tag $GITHUB_REF_NAME) is not reachable from origin/master; release only commits that are already on master"
            exit 1
          fi
          echo "commit $commit is contained in origin/master"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: uv.lock must be consistent with pyproject.toml
        run: |
          uv lock --check
          uv sync --locked

  tests:
    name: Tests (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libfontconfig1 libfreetype6

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Full test suite
        # One line on purpose: this step also runs under PowerShell on Windows.
        run: uv run pytest -q

  package:
    name: Static gates, build, smoke test, checksums
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check (source and tests)
        run: uv run ruff format --check src tests

      - name: Type-check
        run: uv run mypy src

      - name: Build wheel and sdist
        run: |
          rm -rf dist
          uv build
          ls -l dist
          test -n "$(ls dist/*.whl 2>/dev/null)" || { echo "::error::no wheel in dist/"; exit 1; }
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "::error::no sdist in dist/"; exit 1; }

      - name: Built metadata must carry the release version
        run: |
          python3 - <<'EOF'
          import glob, os, sys, tarfile, zipfile
          expected = os.environ["VERSION"]

          def version_from_metadata(text: str) -> str:
              for line in text.splitlines():
                  if line.startswith("Version:"):
                      return line.split(":", 1)[1].strip()
              raise SystemExit("::error::no Version field in package metadata")

          (wheel,) = glob.glob("dist/*.whl")
          (sdist,) = glob.glob("dist/*.tar.gz")
          with zipfile.ZipFile(wheel) as zf:
              (metadata,) = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")]
              wheel_version = version_from_metadata(zf.read(metadata).decode())
          with tarfile.open(sdist) as tf:
              (pkg_info,) = [m for m in tf.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO")]
              sdist_version = version_from_metadata(tf.extractfile(pkg_info).read().decode())
          for name, found in (("wheel", wheel_version), ("sdist", sdist_version)):
              if found != expected:
                  print(f"::error::{name} metadata version {found!r} != release version {expected!r}")
                  sys.exit(1)
          print(f"wheel and sdist metadata carry version {expected}")
          EOF

      - name: Smoke-test the wheel in a clean virtual environment
        run: |
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          test -x /tmp/smoke/bin/giecar-seismic || { echo "::error::console entry point giecar-seismic was not installed"; exit 1; }
          # run from outside the checkout so `import giecar_seismic` can only
          # resolve to the installed wheel, never to ./src
          cd /tmp
          VERSION="$VERSION" /tmp/smoke/bin/python - <<'EOF'
          import os
          from importlib import metadata
          expected = os.environ["VERSION"]
          installed = metadata.version("giecar-seismic")
          assert installed == expected, f"installed {installed!r} != {expected!r}"
          import giecar_seismic  # package importable (no GUI, no QApplication)
          entry_points = [ep for ep in metadata.entry_points(group="console_scripts") if ep.name == "giecar-seismic"]
          assert entry_points, "console_scripts entry point giecar-seismic missing"
          assert entry_points[0].value == "giecar_seismic.__main__:main", entry_points[0].value
          print(f"giecar-seismic {installed} installs, imports and exposes its entry point")
          EOF

      - name: Generate SHA256SUMS
        run: |
          python3 - <<'EOF'
          import hashlib, pathlib
          dist = pathlib.Path("dist")
          files = sorted(p for p in dist.iterdir() if p.suffix in {".whl", ".gz"})
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}" for p in files]
          (dist / "SHA256SUMS").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          EOF
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload release distributions (temporary artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, tests, package]
    runs-on: ubuntu-latest
    # The only write-enabled job: no checkout, no repository code, only the
    # validated artifact from `package` and the GitHub CLI.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Verify checksums of the downloaded artifact
        run: |
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a GitHub Release for $TAG already exists; releases are immutable -- delete it deliberately or tag a new version"
            exit 1
          fi

      - name: Create the GitHub Release
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          gh release view "$TAG"
